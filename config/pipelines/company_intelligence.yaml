# Company Intelligence Pipeline Configuration
# Autonomous research pipeline for comprehensive company analysis

pipeline:
  name: "Company Intelligence Pipeline"
  version: "1.0"
  description: "Autonomous multi-step research pipeline that builds comprehensive intelligence from a company URL"
  
  settings:
    llm_provider: "gemini"  # CHANGED: Use Gemini for Google Search Grounding + URL Context
    model: "gemini-2.5-pro"  # Primary model with Flash fallback
    temperature: 0.3
    enable_web_search: false  # DISABLED: Using Gemini native grounding instead
    enable_vision: true
    enable_thinking: true  # Enable thinking blocks for reasoning transparency
    enable_citations: true  # Enable source citations in responses (now via grounding)
    enable_code_execution: false  # Disable code execution for now
    max_retries: 2
    timeout_per_step: 300  # Increased for grounding processing time
    
  # Pipeline steps execute in dependency order
  steps:
    - id: "discovery"
      name: "Gemini Deep Company Discovery"
      description: "Extract comprehensive information using Gemini Google Search Grounding + URL Context"
      template: "discovery/company_discovery.txt"
      dependencies: []  # First step, no dependencies
      config:
        enable_screenshots: true
        extract_technical_stack: true
        depth: "exhaustive"
        enable_grounding: true  # NEW: Enable Google Search Grounding
        enable_url_context: true  # NEW: Enable direct URL analysis
        require_citations: true  # NEW: Fail if no grounding sources used
        # NOTE: web_search_queries removed - now handled by Gemini grounding automatically
      output_fields:
        - company_name
        - domain
        - industry
        - sub_industry
        - company_description
        - products_services
        - key_features
        - pricing_model
        - target_market_signals
        - company_size
        - founding_year
        - leadership_team
        - locations
        - technical_indicators
        - recent_news
        - social_media_presence
        
    - id: "market_position"
      name: "Gemini Market Position Analysis"
      description: "Understand company's position, differentiation, and market dynamics using Gemini enhanced research"
      template: "market_position/position_analysis.txt"
      dependencies: ["discovery"]
      config:
        analyze_positioning: true
        identify_differentiators: true
        market_size_estimation: true
        enable_grounding: true  # NEW: Use Gemini enhanced research
        enable_url_context: true  # NEW: Company URL context available
        require_citations: true  # NEW: Evidence-based analysis
        # NOTE: web_search_queries removed - now handled by Gemini enhanced prompts
      output_fields:
        - market_category
        - market_position
        - unique_value_propositions
        - key_differentiators
        - market_size
        - growth_indicators
        - industry_trends
        - positioning_strategy
        - brand_perception_signals
        
    - id: "audience_insights"
      name: "Gemini Target Audience Deep Dive"
      description: "Identify and analyze target audiences, use cases, and customer insights using Gemini enhanced research"
      template: "audience_insights/audience_analysis.txt"
      dependencies: ["discovery", "market_position"]
      config:
        build_personas: true
        analyze_use_cases: true
        identify_pain_points: true
        enable_grounding: true  # NEW: Use Gemini enhanced research
        enable_url_context: true  # NEW: Company URL context available
        require_citations: true  # NEW: Evidence-based analysis
        # NOTE: web_search_queries removed - now handled by Gemini enhanced prompts
      output_fields:
        - primary_audiences
        - audience_segments
        - buyer_personas
        - use_cases
        - customer_pain_points
        - jobs_to_be_done
        - buying_triggers
        - decision_criteria
        - customer_journey_insights
        - testimonial_themes
        
    - id: "competitive_landscape"
      name: "Gemini Competitive Intelligence Scan"
      description: "Map competitive landscape and analyze positioning opportunities using Gemini enhanced research"
      template: "competitive_landscape/competitor_analysis.txt"
      dependencies: ["discovery", "market_position", "audience_insights"]
      config:
        competitor_limit: 7
        analyze_direct: true
        analyze_indirect: true
        identify_alternatives: true
        enable_grounding: true  # NEW: Use Gemini enhanced research
        enable_url_context: true  # NEW: Company URL context available
        require_citations: true  # NEW: Evidence-based analysis
        # NOTE: web_search_queries removed - now handled by Gemini enhanced prompts
      output_fields:
        - direct_competitors
        - indirect_competitors
        - competitor_positioning
        - competitive_advantages
        - competitive_gaps
        - market_white_spaces
        - disruption_opportunities
        - partnership_opportunities
        - competitive_strategies
        
    - id: "strategic_synthesis"
      name: "Gemini Strategic Intelligence Synthesis"
      description: "Synthesize all findings into actionable strategic intelligence using Gemini enhanced analysis"
      template: "strategic_synthesis/intelligence_report.txt"
      dependencies: ["discovery", "market_position", "audience_insights", "competitive_landscape"]
      config:
        generate_swot: true
        identify_opportunities: true
        create_recommendations: true
        prioritize_actions: true
        enable_grounding: true  # NEW: Use Gemini enhanced research
        enable_url_context: true  # NEW: Company URL context available
        require_citations: false  # SYNTHESIS: Uses previous step data, citations optional
      output_fields:
        - executive_summary
        - key_insights
        - swot_analysis
        - strategic_opportunities
        - growth_levers
        - risk_factors
        - recommended_strategies
        - quick_wins
        - long_term_plays
        - success_metrics

  # Execution configuration
  execution:
    mode: "sequential"  # Execute steps in order
    save_intermediate: true
    continue_on_error: false
    context_window: 2  # Include 2 previous steps in context
    
  # Output configuration  
  output:
    format: "structured_json"
    include_raw_responses: false
    generate_summary: true
    create_pdf_report: false